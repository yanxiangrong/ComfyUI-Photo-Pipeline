[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-photo-pipeline"
version = "0.1.0"
description = "Memory-safe photo ingestion and preview nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["numpy>=2", "Pillow>=10", "pytest>=8", "ruff>=0.9"]

[tool.setuptools]
packages = ["nodes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
